name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '*' # Build on latest Go release so we catch breakage

    - name: go version
      run: go version

    - name: Build & Test
      run: bash -x test.bash
